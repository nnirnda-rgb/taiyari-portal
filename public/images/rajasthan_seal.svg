<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  
  <!-- Outer Gold Laurel Border -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="88" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
  
  <!-- Top Arch Text -->
  <path id="textArcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <text font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">
      राजस्थान सरकार • GOVT. OF RAJASTHAN
    </textPath>
  </text>
  
  <!-- Bottom Arch Text -->
  <path id="textArcBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  <text font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">
      सत्यमेव जयते • नई सोच, नई पहल
    </textPath>
  </text>

  <!-- Center Shield -->
  <circle cx="100" cy="100" r="50" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Ashoka Chakra Spokes in Center Shield -->
  <g transform="translate(100, 100) scale(0.65)">
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#1E3A8A"/>
    <!-- 24 Spokes of Ashoka Chakra -->
    <g stroke="#1E3A8A" stroke-width="1.8">
      <line x1="0" y1="-42" x2="0" y2="42"/>
      <line x1="-42" y1="0" x2="42" y2="0"/>
      <line x1="-29.7" y1="-29.7" x2="29.7" y2="29.7"/>
      <line x1="29.7" y1="-29.7" x2="-29.7" y2="29.7"/>
      <line x1="-15.3" y1="-39.1" x2="15.3" y2="39.1"/>
      <line x1="15.3" y1="-39.1" x2="-15.3" y2="39.1"/>
      <line x1="-39.1" y1="-15.3" x2="39.1" y2="15.3"/>
      <line x1="39.1" y1="-15.3" x2="-39.1" y2="15.3"/>
      <line x1="-37.3" y1="-19.3" x2="37.3" y2="19.3"/>
      <line x1="37.3" y1="-19.3" x2="-37.3" y2="19.3"/>
      <line x1="-19.3" y1="-37.3" x2="19.3" y2="37.3"/>
      <line x1="19.3" y1="-37.3" x2="-19.3" y2="37.3"/>
    </g>
  </g>

  <!-- Decorative Stars on sides -->
  <polygon points="26,100 28,104 33,104 29,107 30,111 26,108 22,111 23,107 19,104 24,104" fill="#F59E0B"/>
  <polygon points="174,100 176,104 181,104 177,107 178,111 174,108 170,111 171,107 167,104 172,104" fill="#F59E0B"/>
</svg>

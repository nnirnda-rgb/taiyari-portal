<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="80%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="88" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Top Arch Text: ॥ निःशुल्क जन-शिक्षा संकल्प ॥ -->
  <path id="textArcTop" d="M 28,100 A 72,72 0 0,1 172,100" fill="none" />
  <text font-family="'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="12" font-weight="800" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">
    <textPath href="#textArcTop" startOffset="50%">
      ॥ निःशुल्क जन-शिक्षा संकल्प ॥
    </textPath>
  </text>

  <!-- Bottom Arch Text: युवा शिक्षा संबल पहल • रूपसिंह फनात -->
  <path id="textArcBottom" d="M 172,100 A 72,72 0 0,1 28,100" fill="none" />
  <text font-family="'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0.3">
    <textPath href="#textArcBottom" startOffset="50%">
      युवा शिक्षा संबल पहल • रूपसिंह फनात
    </textPath>
  </text>

  <!-- Inner Center Medallion -->
  <circle cx="100" cy="100" r="52" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Radiant Sunburst Rays Behind Book -->
  <g stroke="#FDE68A" stroke-width="1" opacity="0.35" transform="translate(100, 100)">
    <line x1="0" y1="-46" x2="0" y2="-36"/>
    <line x1="32" y1="-32" x2="25" y2="-25"/>
    <line x1="46" y1="0" x2="36" y2="0"/>
    <line x1="32" y1="32" x2="25" y2="25"/>
    <line x1="-32" y1="-32" x2="-25" y2="-25"/>
    <line x1="-46" y1="0" x2="-36" y2="0"/>
    <line x1="-32" y1="32" x2="-25" y2="25"/>
  </g>

  <!-- Open Book of Knowledge (विद्या का ग्रंथ) -->
  <g transform="translate(100, 116)">
    <!-- Book Spine & Pages -->
    <path d="M 0,-6 Q 16,-12 32,-8 L 32,16 Q 16,12 0,16 Z" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <path d="M 0,-6 Q -16,-12 -32,-8 L -32,16 Q -16,12 0,16 Z" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <!-- Page Lines -->
    <line x1="6" y1="-3" x2="26" y2="0" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="6" y1="3" x2="26" y2="6" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="6" y1="9" x2="22" y2="12" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-6" y1="-3" x2="-26" y2="0" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-6" y1="3" x2="-26" y2="6" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-6" y1="9" x2="-22" y2="12" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Center Spine -->
    <line x1="0" y1="-6" x2="0" y2="16" stroke="#B45309" stroke-width="1.5"/>
  </g>

  <!-- Torch / Gyan Deep (ज्ञान की ज्योति - Eternal Flame) -->
  <g transform="translate(100, 84)">
    <!-- Flame Outer Glow -->
    <path d="M 0,-24 C 7,-16 11,-8 6,-1 C 4,3 0,7 0,7 C 0,7 -4,3 -6,-1 C -11,-8 -7,-16 0,-24 Z" fill="url(#flameGrad)" />
    <!-- Flame Inner Core -->
    <path d="M 0,-18 C 3,-13 6,-7 3,-2 C 2,1 0,4 0,4 C 0,4 -2,1 -3,-2 C -6,-7 -3,-13 0,-18 Z" fill="#FFFBEB" opacity="0.9" />
    <!-- Diya / Torch Base -->
    <path d="M -10,7 Q 0,12 10,7 L 6,12 Q 0,14 -6,12 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
  </g>

  <!-- Decorative Stars on Left & Right -->
  <polygon points="24,100 26,104 31,104 27,107 28,111 24,108 20,111 21,107 17,104 22,104" fill="#F59E0B"/>
  <polygon points="176,100 178,104 183,104 179,107 180,111 176,108 172,111 173,107 169,104 174,104" fill="#F59E0B"/>
</svg>
